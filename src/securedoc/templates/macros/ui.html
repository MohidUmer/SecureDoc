{# Reusable UI fragments #}
{% macro password_toggle_button(target_id, button_id) %}
<button
  type="button"
  class="pw-toggle js-pw-toggle"
  id="{{ button_id }}"
  data-target="{{ target_id }}"
  aria-pressed="false"
  aria-label="Show password"
>
  <span class="pw-toggle__icon pw-toggle__icon--show" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </span>
  <span class="pw-toggle__icon pw-toggle__icon--hide" aria-hidden="true" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  </span>
</button>
{% endmacro %}
